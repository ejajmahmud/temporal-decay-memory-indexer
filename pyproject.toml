[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-decay-memory-indexer"
version = "0.1.0"
description = "Ebbinghaus forgetting curve memory indexer calculating exponential retention curves to automatically prune working memory"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
temporal-decay-memory-indexer = "temporal_decay_memory_indexer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["temporal_decay_memory_indexer*"]
